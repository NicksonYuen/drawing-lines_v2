<style>
/* Layout: a start screen, then one big drawing board of dots. Same calm light theme as Passcode Match. */
:root{
  --bg:#F4F7FB;
  --surface:#FFFFFF;
  --ink:#10213A;
  --muted:#5A6A80;
  --line:#C8D2E0;
  --next:#FFC93C;
  --good:#1E9A53;
  --bad:#D2433F;
  --font:"Atkinson Hyperlegible","PingFang HK","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;margin:0;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden;
  overscroll-behavior:none;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.screen{height:100%;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}

/* ---------- Home ---------- */
#home{align-items:center;justify-content:center;gap:32px;overflow-y:auto}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px}
.brand h1{margin:0;font-size:clamp(2.4rem,7vw,3.6rem);letter-spacing:.04em}
.brand p{margin:0;color:var(--muted);font-size:1.15rem}
.logo{width:160px;height:auto}
.start{border:0;background:var(--ink);color:#fff;font-size:2rem;font-weight:700;border-radius:999px;padding:18px 64px;box-shadow:0 6px 0 #04101F}
.start:active{transform:translateY(4px);box-shadow:0 2px 0 #04101F}
.how{margin:0;color:var(--muted);font-size:1.1rem;text-align:center;max-width:460px;line-height:1.5}
.ghost{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-size:1rem}
.voice{margin:0;font-size:.95rem;color:var(--muted);text-align:center;max-width:520px;line-height:1.45}
.voice.warn{color:var(--bad)}

/* ---------- Play ---------- */
#play{gap:12px;align-items:center;position:relative}
.bar{width:100%;max-width:1100px;display:flex;justify-content:space-between;align-items:center}
.hold{position:relative;overflow:hidden;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;font-size:.95rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.hold i{position:absolute;left:0;bottom:0;height:5px;width:0;background:var(--ink)}
.hold.go i{width:100%;transition:width 1.5s linear}
.listen{border:3px solid var(--ink);background:var(--surface);border-radius:999px;padding:10px 22px 10px 16px;font-size:1.25rem;font-weight:700;display:flex;align-items:center;gap:10px}
.listen svg{width:30px;height:30px}
.listen:active{background:var(--next)}
/* The drawing board: white paper with a dot grid. touch-action:none so a finger draws instead of scrolling. */
.board{flex:1;width:100%;max-width:1100px;min-height:0;background:var(--surface);border:3px solid var(--line);border-radius:24px;position:relative;overflow:hidden}
#board{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.board.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.cheer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;pointer-events:none;z-index:6}
/* Running cat (win celebration): a cartoon of Evan's cat, runs around the screen for DANCE_MS */
.runner{position:fixed;left:0;top:0;width:min(40vw,330px);pointer-events:none;z-index:7;will-change:transform}
.runner .flip{transform-origin:50% 50%}
.runner .headgrp{transform-box:view-box;transform-origin:194px 70px} /* turned back when running left, so the dark side of the face stays on the same side as the real cat */
.runner svg{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 8px 8px rgba(16,33,58,.25))}
.runner .gallop{transform-box:view-box;transform-origin:130px 180px;animation:gallop .32s ease-in-out infinite alternate}
.runner .leg{transform-box:fill-box;transform-origin:50% 8%}
.runner .lf1{animation:swingA .32s ease-in-out infinite alternate}
.runner .lf2{animation:swingA .32s ease-in-out infinite alternate;animation-delay:-.08s}
.runner .lb1{animation:swingB .32s ease-in-out infinite alternate}
.runner .lb2{animation:swingB .32s ease-in-out infinite alternate;animation-delay:-.08s}
.runner .tail{transform-box:view-box;transform-origin:70px 104px;animation:wag .32s ease-in-out infinite alternate}
.runner .ears{transform-box:view-box;transform-origin:194px 70px;animation:perk .64s ease-in-out infinite alternate}
@keyframes gallop{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-14px) rotate(3deg)}}
@keyframes swingA{from{transform:rotate(38deg)}to{transform:rotate(-38deg)}}
@keyframes swingB{from{transform:rotate(-38deg)}to{transform:rotate(38deg)}}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(10deg)}}
@keyframes perk{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.cheer b{font-size:clamp(3rem,12vw,7rem);color:var(--ink);background:var(--next);padding:.15em .5em;border-radius:.35em;
  border:5px solid var(--ink);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
@media (prefers-reduced-motion:reduce){ .board.shake{animation:none} }

/* level picker on the start screen (for a parent) */
.levels{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.lvl{border:3px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 16px;font-size:1.2rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:120px}
.lvl small{font-size:.85rem;font-weight:400;color:var(--muted)}
.lvl[aria-pressed="true"]{border-color:var(--ink);background:var(--next)}
.lvl[aria-pressed="true"] small{color:var(--ink)}
.tag{font-weight:700;font-size:1.05rem;color:var(--muted)}
</style>
</head>
<body>
<section class="screen" id="home">
  <div class="brand">
    <svg class="logo" viewBox="0 0 160 110" aria-hidden="true">
      <g fill="#C8D2E0"><circle cx="20" cy="20" r="5"/><circle cx="50" cy="20" r="5"/><circle cx="80" cy="20" r="5"/><circle cx="110" cy="20" r="5"/><circle cx="140" cy="20" r="5"/>
      <circle cx="20" cy="90" r="5"/><circle cx="50" cy="90" r="5"/><circle cx="80" cy="90" r="5"/><circle cx="110" cy="90" r="5"/><circle cx="140" cy="90" r="5"/></g>
      <path d="M20 20V90H60" fill="none" stroke="#10213A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

<section class="screen" id="play" hidden>
  <div class="bar">
    <button class="hold" id="holdBtn" type="button" aria-label="Hold to go back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      按住返回<i></i>
    </button>
    <span class="tag" id="levelTag"></span>
    <button class="listen" id="listenBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      再講一次
    </button>
  </div>
  <div class="board" id="boardWrap"><canvas id="board" aria-label="畫線板"></canvas></div>

          <!-- tail: big, fluffy, cream -->
          <g class="tail"><path d="M74 104 C48 96 30 70 34 34" fill="none" stroke="#DCCDB8" stroke-width="30" stroke-linecap="round"/><path d="M74 104 C48 96 30 70 34 34" fill="none" stroke="#F1E6D6" stroke-width="26" stroke-linecap="round"/></g>
          <!-- far legs -->
          <g class="leg lb2"><rect x="80" y="112" width="18" height="52" rx="9" fill="#E6D8C4"/><ellipse cx="89" cy="164" rx="12" ry="7" fill="#F3ECE2"/></g>
          <g class="leg lf2"><rect x="150" y="112" width="18" height="52" rx="9" fill="#E6D8C4"/><ellipse cx="159" cy="164" rx="12" ry="7" fill="#F3ECE2"/></g>
          <!-- body: fluffy cream -->
          <ellipse cx="122" cy="112" rx="64" ry="34" fill="#FBF6EE" stroke="#DCCDB8" stroke-width="2"/>
          <ellipse cx="116" cy="94" rx="46" ry="12" fill="#EFE3D1"/>
          <!-- near legs -->
          <g class="leg lb1"><rect x="92" y="118" width="20" height="54" rx="10" fill="#F6EEE2" stroke="#DCCDB8" stroke-width="2"/><rect x="94" y="140" width="16" height="18" rx="6" fill="#6B4E3D"/><ellipse cx="102" cy="172" rx="13" ry="7.5" fill="#fff" stroke="#DCCDB8" stroke-width="2"/></g>
          <g class="leg lf1"><rect x="160" y="118" width="20" height="54" rx="10" fill="#F6EEE2" stroke="#DCCDB8" stroke-width="2"/><ellipse cx="170" cy="172" rx="13" ry="7.5" fill="#fff" stroke="#DCCDB8" stroke-width="2"/></g>
          <!-- white fluffy chest ruff -->
          <circle cx="176" cy="110" r="26" fill="#fff" stroke="#E4D8C6" stroke-width="2"/>
          <!-- head, facing us -->
          <g id="runHead" class="headgrp"><g class="ears">
            <path d="M162 66 L164 20 L194 46 Z" fill="#3B2A22"/><path d="M167 58 L168 32 L186 48 Z" fill="#D9A79A"/>
            <path d="M226 66 L224 20 L194 46 Z" fill="#3B2A22"/><path d="M221 58 L220 32 L202 48 Z" fill="#D9A79A"/>
          </g>
          <circle cx="194" cy="74" r="38" fill="#FBF4EA" stroke="#DCCDB8" stroke-width="2"/>

          <!-- half-dark face: dark on the right of the nose, peach on the left -->

          <ellipse cx="186" cy="84" rx="8" ry="10" fill="#F0C59C" opacity=".85"/>
          <ellipse cx="179" cy="72" rx="7" ry="6" fill="#6E9BD8"/><circle cx="179" cy="72.5" r="3.2" fill="#1E1512"/><circle cx="181" cy="70.5" r="1.6" fill="#fff"/>
          <ellipse cx="210" cy="72" rx="7" ry="6" fill="#6E9BD8"/><circle cx="210" cy="72.5" r="3.2" fill="#1E1512"/><circle cx="212" cy="70.5" r="1.6" fill="#fff"/>
          <path d="M189 88 L199 88 L194 94 Z" fill="#1E1512"/>
          <path d="M194 94 Q190 100 185 98 M194 94 Q198 100 203 98" fill="none" stroke="#1E1512" stroke-width="2" stroke-linecap="round"/>
          <g stroke="#B8AC9F" stroke-width="1.4" stroke-linecap="round">
            <path d="M178 92 L148 86"/><path d="M178 95 L148 98"/><path d="M210 92 L240 86"/><path d="M210 95 L240 98"/>
          </g></g>
        </g>
      </svg>
    </div></div>
  </div>
</section>

<canvas id="fx" hidden></canvas>

<script>
(function(){
/* ---------- settings you can change ---------- */
const COLS=7;            /* squares across the board (8 dots in a row) */
/* Levels. Each question is a straight line or a shape with one corner.
   corners: which way the corner may point. 'L' = corner bottom-left, 'r' = top-left (like Γ),
   '7' = top-right, 'J' = bottom-right.
   same: true = across part and up-and-down part are the same length.
   oneShare: how often the across part is just 1 square (the rest of the time it is 2).
   across / down: smallest and largest length in squares (across at most 3, so the copy fits on the right).
   straight: share of questions that are a straight line (leave out to use STRAIGHT_SHARE). */
const LEVELS={
  1:{name:'第一級',note:'一個角',same:false,across:[1,2],down:[2,4],corners:['L','7'],oneShare:0.75,straight:0}, /* always a corner shape; across part 1 square 3 times in 4, else 2 */
  2:{name:'第二級',note:'兩邊唔一樣長',same:false,across:[1,3],down:[1,5],corners:['L']},
  3:{name:'第三級',note:'唔同方向',  same:false,across:[1,3],down:[1,5],corners:['L','r','7','J']}
};
const STRAIGHT_SHARE=0.25; /* about 1 question in 4 is a straight line */
const JUDGE_MS=1500;     /* after he lifts his finger, wait this long for another stroke before checking */
const SNAP=0.35;         /* how wobbly a stroke may be before it counts as a turn, as a share of one square */
const SAY_SHAPE='喺右邊，畫一個一模一樣嘅形狀。';
const SAY_LINE='喺右邊，畫一條一樣長嘅線。';
const SAY_WIN='旺寶仔，好叻仔，下次李姑娘會讚員翼陽！';
const SAY_RETRY='請再試一次。';
const IDLE_MS=10000;     /* nothing drawn for this long: say the instruction again */
const DANCE_MS=5000;     /* how long the cat runs after a right answer */
const $=id=>document.getElementById(id);

/* ---------- state ---------- */
let level=1,q=null,prevKey='',strokes=[],stroke=null,pointerId=null,marks=null,locked=false;
let afterTimer=null,idleTimer=null,judgeTimer=null,wakeLock=null,current='home';
let geo={cell:60,mx:0,my:0,rows:8,w:0,h:0};
const once=f=>{let done=false;return()=>{if(!done){done=true;f()}}};
try{const s=+localStorage.getItem('dl2_level');if(LEVELS[s])level=s}catch(_){}

/* ---------- audio effects ---------- */
let ac=null;
function audio(){
  if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(C)ac=new C()}
  if(ac&&ac.state==='suspended')ac.resume();
  return ac;
}
function tone(f,start,dur,type,vol,endF){
  const a=audio();if(!a)return;
  const t=a.currentTime+start,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(endF)o.frequency.exponentialRampToValueAtTime(endF,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.25,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.05);
}
const sfx={
  good(){tone(784,0,.18,'triangle',.32);tone(1175,.09,.3,'triangle',.32)},
  bad(){tone(392,0,.4,'sine',.22,247)},
  win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.11,.45,'triangle',.28))},
  pop(){tone(220,0,.14,'sine',.12,90)}
};

/* ---------- Cantonese speech ---------- */
let voice=null,speechId=0;
const hasTTS='speechSynthesis' in window;
function pickVoice(){
  if(!hasTTS)return statusVoice();
  const vs=speechSynthesis.getVoices();
  voice=vs.find(v=>/zh[-_]HK/i.test(v.lang))||vs.find(v=>/yue/i.test(v.lang))||vs.find(v=>/Sinji|Cantonese|粵|廣東/i.test(v.name))||null;
  statusVoice(vs.length>0);
}
function statusVoice(loaded){
  const el=$('voiceStatus');
  if(!hasTTS){el.textContent='呢部機唔支援語音朗讀，遊戲只會有音效。';el.className='voice warn';return}
  if(voice){el.textContent='廣東話聲音：'+voice.name+'。開始前可以撳「試聲」聽吓。';el.className='voice';return}
  if(loaded===false)return;
  el.innerHTML='搵唔到廣東話聲音。iPad：設定 › 輔助使用 › 朗讀內容 › 聲音 › 中文（香港），下載「Sinji」。<br>No Cantonese voice found: Settings › Accessibility › Spoken Content › Voices › Chinese (Hong Kong).';
  el.className='voice warn';
}
if(hasTTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;setTimeout(pickVoice,800)}
function stopSpeech(){speechId++;if(hasTTS)speechSynthesis.cancel()}
function say(text,onend){
  const id=++speechId;
  let done=false;
  const fin=()=>{if(done||id!==speechId)return;done=true;onend&&onend()};
  if(!hasTTS){setTimeout(fin,600);return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-HK';if(voice)u.voice=voice;u.rate=.85;u.pitch=1.05;
  u.onend=fin;u.onerror=fin;
  setTimeout(()=>{if(id===speechId)speechSynthesis.speak(u)},60);
  setTimeout(fin,2000+text.length*420); /* safety net if the browser never fires onend */
}
const instruction=()=>q.straight?SAY_LINE:SAY_SHAPE;

/* ---------- screens ---------- */
function show(name){current=name;['home','play'].forEach(s=>$(s).hidden=s!==name)}
$('testBtn').onclick=()=>{audio();sfx.good();setTimeout(()=>say('你好！'+SAY_WIN),400)};
$('startBtn').onclick=startGame;
function showLevel(){
  document.querySelectorAll('.lvl').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.level===level?'true':'false'));
  $('levelTag').textContent=LEVELS[level].name;
}
document.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>{
  level=+b.dataset.level;try{localStorage.setItem('dl2_level',level)}catch(_){}
  showLevel();
});
showLevel();

/* ---------- board size: dots sit on a square grid that fills the board ---------- */
const cv=$('board'),g=cv.getContext('2d');
function measure(){
  /* keep the board upright (taller than wide), like a sheet of paper on an iPad held upright */
  const wrap=$('boardWrap');wrap.style.width='';
  const room=wrap.parentElement.clientWidth-32;
  wrap.style.width=Math.min(room,wrap.clientHeight*0.75)+'px';
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  g.setTransform(dpr,0,0,dpr,0,0);
  const cell=Math.min((r.width-40)/COLS,(r.height-40)/8,120);
  const rows=Math.max(6,Math.floor((r.height-40)/cell));
  geo={cell,rows,w:r.width,h:r.height,mx:(r.width-COLS*cell)/2,my:(r.height-rows*cell)/2};
}
const px=c=>geo.mx+c*geo.cell, py=r=>geo.my+r*geo.cell;      /* grid -> screen */
const gx=x=>(x-geo.mx)/geo.cell, gy=y=>(y-geo.my)/geo.cell;  /* screen -> grid */
addEventListener('resize',()=>{if(current!=='play')return;measure();if(q&&q.bottom>geo.rows)newRound();else draw()});

/* ---------- shapes as little pieces: every one-square bit of line is one "edge" ----------
   'h3,5' = the bit going across from dot (3,5) to dot (4,5); 'v3,5' = the bit going down from (3,5) to (3,6).
   Two drawings are the same shape when they have the same edges, moved over. */
function edgesOf(points){
  const set=new Set();
  for(let i=1;i<points.length;i++){
    const [x1,y1]=points[i-1],[x2,y2]=points[i];
    if(y1===y2)for(let x=Math.min(x1,x2);x<Math.max(x1,x2);x++)set.add('h'+x+','+y1);
    else if(x1===x2)for(let y=Math.min(y1,y2);y<Math.max(y1,y2);y++)set.add('v'+x1+','+y);
  }
  return set;
}
function box(set){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  set.forEach(k=>{const [x,y]=k.slice(1).split(',').map(Number),h=k[0]==='h';
    x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,h?x+1:x);y1=Math.max(y1,h?y:y+1)});
  return {x0,y0,x1,y1};
}
const count=(set,t)=>[...set].filter(k=>k[0]===t).length;
function shifted(set,dx,dy){const o=new Set();set.forEach(k=>{const [x,y]=k.slice(1).split(',').map(Number);o.add(k[0]+(x+dx)+','+(y+dy))});return o}
const sameSet=(a,b)=>a.size===b.size&&[...a].every(k=>b.has(k));

/* ---------- question: a straight line, or a shape with one corner ---------- */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function makeQuestion(){
  const L=LEVELS[level];let n,k;
  do{
    let pts,straight=Math.random()<(L.straight??STRAIGHT_SHARE),w,h;
    if(straight){
      if(Math.random()<.5){w=rnd(Math.max(2,L.across[0]),L.across[1]);h=0;pts=[[0,0],[w,0]]}
      else{h=rnd(Math.max(2,L.down[0]),L.down[1]);w=0;pts=[[0,0],[0,h]]}
    }else{
      if(L.oneShare){w=Math.random()<L.oneShare?1:2;h=rnd(L.down[0],L.down[1])}
      else if(L.same){w=h=rnd(L.across[0],Math.min(L.across[1],L.down[1]))}
      else{do{w=rnd(L.across[0],L.across[1]);h=rnd(L.down[0],L.down[1])}while(w===h)}
      pts={L:[[0,0],[0,h],[w,h]],r:[[0,h],[0,0],[w,0]],'7':[[0,0],[w,0],[w,h]],J:[[w,0],[w,h],[0,h]]}[pick(L.corners)];
    }
    h=Math.min(h,geo.rows);
    /* leave room on the right for his copy: the copy must start right of the question */
    const c0=rnd(0,Math.max(0,COLS-2*w-1)),r0=rnd(0,Math.max(0,geo.rows-h));
    pts=pts.map(([x,y])=>[x+c0,y+r0]);
    const edges=edgesOf(pts);
    n={pts,edges,straight,box:box(edges),bottom:r0+h};
    k=pts.join(';');
  }while(k===prevKey);
  prevKey=k;return n;
}

/* ---------- turning his finger strokes into edges on the dots ---------- */
/* keep only the points where the stroke turns (Ramer-Douglas-Peucker), then snap them to the nearest dots */
function simplify(p,eps){
  if(p.length<3)return p.slice();
  const [a,b]=[p[0],p[p.length-1]],dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy)||1e-9;
  let best=-1,idx=0;
  for(let i=1;i<p.length-1;i++){const d=Math.abs(dy*p[i][0]-dx*p[i][1]+b[0]*a[1]-b[1]*a[0])/len;if(d>best){best=d;idx=i}}
  if(best<=eps)return [a,b];
  const l=simplify(p.slice(0,idx+1),eps),r=simplify(p.slice(idx),eps);
  return l.slice(0,-1).concat(r);
}
function strokeToEdges(s,set){
  const grid=s.map(p=>[gx(p[0]),gy(p[1])]);
  const pts=simplify(grid,SNAP).map(p=>[Math.round(p[0]),Math.round(p[1])]);
  let slanted=false;
  for(let i=1;i<pts.length;i++){
    const [x1,y1]=pts[i-1],[x2,y2]=pts[i];
    if(x1===x2&&y1===y2)continue;
    if(x1!==x2&&y1!==y2){slanted=true;continue}
    edgesOf([pts[i-1],pts[i]]).forEach(e=>set.add(e));
  }
  return slanted;
}

/* ---------- drawing ---------- */
function line(x1,y1,x2,y2,col,w,dash){
  g.save();g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';if(dash)g.setLineDash(dash);
  g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.restore();
}
function poly(pts,col,w){
  g.save();g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.lineJoin='round';
  g.beginPath();pts.forEach((p,i)=>i?g.lineTo(px(p[0]),py(p[1])):g.moveTo(px(p[0]),py(p[1])));g.stroke();g.restore();
  dot(px(pts[0][0]),py(pts[0][1]),w*.9,col);dot(px(pts[pts.length-1][0]),py(pts[pts.length-1][1]),w*.9,col);
}
function dot(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function draw(){
  const {cell,rows,w,h}=geo,W=Math.max(8,cell*.14);
  g.clearRect(0,0,w,h);
  for(let c=0;c<=COLS;c++)for(let r=0;r<=rows;r++)dot(px(c),py(r),Math.max(3,cell*.05),'#C8D2E0');
  if(!q)return;
  if(marks&&marks.guides)[q.box.y0,q.box.y1].forEach(r=>line(0,py(r),w,py(r),'#1E9A53',3,[10,10])); /* the rows his shape should sit between */
  poly(q.pts,'#10213A',W);
  if(marks&&marks.answer)poly(marks.answer,'#1E9A53',W);
  const all=stroke?strokes.concat([stroke]):strokes;
  all.forEach(s=>{
    if(s.length<2)return;
    g.save();g.strokeStyle=marks&&marks.bad?'#D2433F':'#FF8A1F';g.lineWidth=W;g.lineCap='round';g.lineJoin='round';
    g.beginPath();g.moveTo(s[0][0],s[0][1]);s.forEach(p=>g.lineTo(p[0],p[1]));g.stroke();g.restore();
  });
}

/* ---------- finger input: one finger at a time; he may lift and draw again before it is checked ---------- */
function pos(e){const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',e=>{
  if(locked||current!=='play'||pointerId!==null)return;
  e.preventDefault();audio();clearIdle();stopSpeech();clearTimeout(judgeTimer);
  pointerId=e.pointerId;try{cv.setPointerCapture(e.pointerId)}catch(_){}
  marks=null;stroke=[pos(e)];draw();
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerId!==pointerId||!stroke)return;
  const list=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  list.forEach(ev=>stroke.push(pos(ev)));draw();
});
const lift=e=>{
  if(e.pointerId!==pointerId)return;
  pointerId=null;
  if(!stroke)return;
  const s=stroke;stroke=null;
  const xs=s.map(p=>gx(p[0])),ys=s.map(p=>gy(p[1]));
  if(Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys))>=.5)strokes.push(s); /* a tap or a dot is ignored */
  draw();
  if(!strokes.length){armIdle();return}
  /* right already: celebrate at once. Otherwise give him a moment to add the next stroke. */
  const r=judge();
  if(r.ok)return win(r);
  judgeTimer=setTimeout(()=>{if(current==='play'&&!locked&&pointerId===null)wrong(r.msg,r.marks)},JUDGE_MS);
};
cv.addEventListener('pointerup',lift);
cv.addEventListener('pointercancel',lift);

/* ---------- checking the answer ----------
   His copy must be the same shape and size, sit fully on the right of the question,
   and use the same rows (same top and bottom). It may be any distance to the right. */
function judge(){
  const mine=new Set();let slanted=false;
  strokes.forEach(s=>{if(strokeToEdges(s,mine))slanted=true});
  const t=q.edges,guides={guides:true};
  if(slanted||!mine.size)return {msg:'哎呀，要打直或者打橫畫，唔可以斜呀。',marks:guides};
  const b=box(mine),tb=q.box;
  const dx=b.x0-tb.x0,dy=b.y0-tb.y0;
  if(b.x0<=tb.x1)return {msg:'哎呀，要喺右邊畫呀。',marks:guides};
  const hT=count(t,'h'),vT=count(t,'v'),hM=count(mine,'h'),vM=count(mine,'v');
  if(!sameSet(shifted(t,dx,dy),mine)){
    let msg;
    if(hM!==hT&&vM!==vT)msg='哎呀，打橫同打直都唔啱長度呀。';
    else if(hM!==hT)msg='哎呀，打橫嗰條線'+(hM>hT?'太長':'太短')+'呀。';
    else if(vM!==vT)msg='哎呀，打直嗰條線'+(vM>vT?'太長':'太短')+'呀。';
    else msg='哎呀，個形狀唔一樣呀，睇清楚個角喺邊度。';
    return {msg,marks:guides};
  }
  if(dy<0)return {msg:'哎呀，畫得太高呀，要喺同一行開始。',marks:guides};
  if(dy>0)return {msg:'哎呀，畫得太低呀，要喺同一行開始。',marks:guides};
  return {ok:true,answer:q.pts.map(([x,y])=>[x+dx,y])};
}
function wrong(msg,m){
  sfx.bad();setLocked(true);
  marks=Object.assign({bad:true},m);draw();
  const b=$('boardWrap');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
  /* clear his lines when the voice finishes, or after a fallback timer if the speech gets cut off */
  const unlock=once(()=>{if(current!=='play')return;strokes=[];stroke=null;marks=null;setLocked(false);draw();armIdle()});
  afterTimer=setTimeout(()=>{say(msg+SAY_RETRY,()=>{afterTimer=setTimeout(unlock,600)});afterTimer=setTimeout(unlock,8000)},420);
}

/* ---------- game ---------- */
function setLocked(v){locked=v}
function startGame(){
  audio();show('play');measure();
  if(navigator.wakeLock&&navigator.wakeLock.request){navigator.wakeLock.request('screen').then(l=>wakeLock=l).catch(()=>{})}
  newRound(true);
}
function newRound(first){
  clearTimeout(afterTimer);clearTimeout(judgeTimer);clearIdle();
  $('cheer').hidden=true;$('dancer').hidden=true;
  q=makeQuestion();strokes=[];stroke=null;marks=null;pointerId=null;setLocked(false);draw();
  say((first?'開始！':'')+instruction(),armIdle);
}
function win(r){
  clearTimeout(judgeTimer);setLocked(true);clearIdle();
  strokes=[];marks={answer:r.answer};draw();
  sfx.win();
  $('cheer').hidden=false;$('dancer').hidden=false;runAround();
  fireworks();
  /* the next question starts on a fixed timer, so a cut-off praise line can never stop the game */
  setTimeout(()=>{if(current==='play')say(SAY_WIN)},650);
  afterTimer=setTimeout(()=>{if(current==='play')newRound()},DANCE_MS+800);
}
function armIdle(){clearIdle();if(current==='play'&&!document.hidden)idleTimer=setTimeout(onIdle,IDLE_MS)}
function clearIdle(){clearTimeout(idleTimer);idleTimer=null}
function onIdle(){if(locked||current!=='play'||stroke||strokes.length)return;say(instruction(),armIdle)}
$('listenBtn').onclick=()=>{if(locked)return;clearIdle();say(instruction(),armIdle)};
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearIdle();stopSpeech()}else if(current==='play'&&!locked)armIdle()});

function endGame(){
  clearTimeout(afterTimer);clearTimeout(judgeTimer);clearIdle();stopSpeech();setLocked(false);
  if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null}
  stopFx();$('cheer').hidden=true;$('dancer').hidden=true;
  q=null;strokes=[];stroke=null;marks=null;
  show('home');
}
/* hold to exit, so a stray tap doesn't end the game */
(function(){
  const b=$('holdBtn');let t=null;
  const startHold=e=>{e.preventDefault();b.classList.add('go');t=setTimeout(()=>{b.classList.remove('go');endGame()},1500)};
  const cancel=()=>{clearTimeout(t);b.classList.remove('go')};
  b.addEventListener('pointerdown',startHold);
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,cancel));
  b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')endGame()});
})();

/* ---------- running cat ---------- */
let runRaf=0;
function runAround(){
  const el=$('dancer'),fl=$('runFlip'),head=$('runHead');
  const W=el.offsetWidth,H=W*200/260,vw=innerWidth,vh=innerHeight;
  const cx=vw/2,cy=vh*.5,A=(vw-W)/2*.95,B=vh*.22;
  /* infinity path: middle, top right, round the right loop to bottom right, back through the middle,
     top left, round the left loop to bottom left, back to the middle */
  const at=t=>[cx+A*Math.sin(t),cy-B*Math.sin(2*t)];
  const place=(x,y,rot,left)=>{
    el.style.transform='translate('+(x-W/2)+'px,'+(y-H/2)+'px) rotate('+rot+'deg)';
    fl.style.transform=left?'scaleX(-1)':'';
    head.style.transform=left?'scaleX(-1)':''; /* keep the dark side of her face on the real side */
  };
  cancelAnimationFrame(runRaf);
  if(reduced){place(cx,cy,0,false);return}
  const t0=performance.now();let left=false;
  const frame=now=>{
    if(el.hidden)return;
    const k=Math.min(1,(now-t0)/DANCE_MS),t=k*2*Math.PI;
    const [x,y]=at(t),[x2,y2]=at(t+.02),dx=x2-x,dy=y2-y;
    if(Math.abs(dx)>.5)left=dx<0;
    let rot=left?-Math.atan2(dy,-dx):Math.atan2(dy,dx);
    rot=Math.max(-25,Math.min(25,rot*180/Math.PI));
    place(x,y,k<1?rot:0,k<1?left:false);
    if(k<1)runRaf=requestAnimationFrame(frame);
  };
  runRaf=requestAnimationFrame(frame);
}

/* ---------- fireworks ---------- */
const fxc=$('fx'),fxg=fxc.getContext('2d');
let parts=[],raf=0,fxEnd=0;
const COLORS=['#FFC93C','#1E9A53','#2F6BFF','#D2433F','#8E44EC','#FF8A1F'];
const reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function burst(){
  const w=fxc.width,h=fxc.height,x=w*(.15+Math.random()*.7),y=h*(.12+Math.random()*.4);
  const col=COLORS[Math.floor(Math.random()*COLORS.length)],n=reduced?24:70,dpr=window.devicePixelRatio||1;
  for(let i=0;i<n;i++){
    const a=Math.PI*2*i/n,sp=(2+Math.random()*4.5)*dpr;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,col,r:(2.5+Math.random()*2.5)*dpr});
  }
  sfx.pop();
}
function fireworks(){
  const dpr=window.devicePixelRatio||1;
  fxc.width=innerWidth*dpr;fxc.height=innerHeight*dpr;fxc.hidden=false;
  parts=[];fxEnd=performance.now()+3600;
  const count=reduced?2:6;
  for(let i=0;i<count;i++)setTimeout(burst,i*380);
  cancelAnimationFrame(raf);raf=requestAnimationFrame(step);
}
function step(now){
  fxg.clearRect(0,0,fxc.width,fxc.height);
  const g=.07*(window.devicePixelRatio||1);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=g;p.vx*=.985;p.life-=.012;
    if(p.life>0){fxg.globalAlpha=p.life;fxg.fillStyle=p.col;fxg.beginPath();fxg.arc(p.x,p.y,p.r,0,7);fxg.fill()}});
  fxg.globalAlpha=1;
  parts=parts.filter(p=>p.life>0);
  if(now<fxEnd||parts.length)raf=requestAnimationFrame(step);else stopFx();
}
function stopFx(){cancelAnimationFrame(raf);parts=[];fxg.clearRect(0,0,fxc.width,fxc.height);fxc.hidden=true}
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
